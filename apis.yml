name: 3com
description: 3Com Corporation was a networking-technology pioneer founded in 1979 by Robert Metcalfe,
  the co-inventor of Ethernet, and colleagues; its name derived from "Computer, Communication, and
  Compatibility." 3Com built Ethernet network interface cards, switches, routers, and enterprise
  networking and security hardware, and at one point owned the Palm handheld computing business. An
  early Mayfield Fund portfolio investment (seed participation in 1981, alongside NEA, Venrock, and
  Sequoia), 3Com later operated the 3Com, H3C, and TippingPoint brands before being acquired by
  Hewlett-Packard in 2010 for roughly $2.7 billion, after which the standalone brand was wound down.
  This record is a historical company profile; 3Com no longer operates an independent developer
  portal, public API, or live product surface (the 3com.com domain now serves a placeholder page).
